[project]
name = "extensiondesk"
version = "0.1.0"
description = "An MCP agent that drafts sourced, officer-approved planting advisories for a local agricultural extension desk."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.9",
  "langgraph>=0.4",
  "langchain-mcp-adapters>=0.1",
  "langchain-openai>=0.3",
  "pyyaml>=6",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
extensiondesk = "extensiondesk.cli:main"
extensiondesk-server = "extensiondesk.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extensiondesk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
